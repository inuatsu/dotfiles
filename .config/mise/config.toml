[tasks."update:mise"]
description = "Update mise and plugins"
run = "mise self-update && mise upgrade"

[tasks."update:brew"]
description = "Update Homebrew packages"
run = "brew update && brew upgrade && brew cleanup"

[tasks."update:aube"]
description = "Update aube global packages"
run = "aube update --global --latest"

[tasks.update]
description = "Run updates of all the dev tools"
depends = ["update:*"]

[tasks."doctor:mise"]
description = "Check mise installation for possible problems"
run = "source ~/.zprofile && mise doctor"

[tasks."doctor:brew"]
description = "Check possible problems with brew"
run = "brew doctor"

[tasks."doctor:aube"]
description = "Checks for known common issues with aube configuration"
run = "aube doctor"

[tasks.doctor]
description = "Check issues with configuration of all the dev tools"
depends = ["doctor:*"]

